<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  <!-- Dark backdrop -->
  <rect width="100" height="100" rx="24" fill="#070709"/>
  <!-- Inner ring decoration -->
  <circle cx="50" cy="50" r="44" stroke="#1f1f23" stroke-width="1.5" fill="none" />
  <!-- Barbell steel bar -->
  <rect x="15" y="47" width="70" height="6" rx="3" fill="#E2E8F0" opacity="0.4"/>
  <rect x="42" y="45" width="16" height="10" rx="2" fill="#64748B" opacity="0.6"/>
  <!-- Outermost smaller plates -->
  <rect x="20" y="32" width="6" height="36" rx="2" fill="#8B5CF6"/>
  <rect x="74" y="32" width="6" height="36" rx="2" fill="#10B981"/>
  <!-- Inner large plates -->
  <rect x="28" y="22" width="8" height="56" rx="3" fill="url(#neonGrad)"/>
  <rect x="64" y="22" width="8" height="56" rx="3" fill="url(#neonGrad)"/>
  <!-- Collar / lock -->
  <rect x="38" y="40" width="3" height="20" rx="1" fill="#FFFFFF" opacity="0.8"/>
  <rect x="59" y="40" width="3" height="20" rx="1" fill="#FFFFFF" opacity="0.8"/>
</svg>
